# Local-only override (not the canonical config).
# Host port 5000 is occupied by another project on this machine,
# so expose the backend on 5001 instead. The frontend still reaches
# the backend via the internal Docker network (service "backend:5000"),
# so this only changes direct host access to the API.
services:
  backend:
    ports: !override
      - "5001:5000"

  # Host port 8080 is taken by another project too (a WordPress stack), so the
  # site is served on 8081. Container-side is still 80. BACKEND_URL is baked
  # into the JS bundle at build time, so it has to match the host-side
  # backend port above (5001), not the in-container one.
  frontend:
    build:
      args:
        BACKEND_URL: http://localhost:5001
    ports: !override
      - "8081:80"
