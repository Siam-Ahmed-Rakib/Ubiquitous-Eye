services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: capstone-backend
    environment:
      SH_CLIENT_ID: ${SH_CLIENT_ID}
      SH_CLIENT_SECRET: ${SH_CLIENT_SECRET}
      # Result cache (Supabase Postgres). Empty = cache disabled, endpoints
      # behave exactly as before. Set in .env; never commit a real value.
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ./server/GRANULE:/app/GRANULE
      # NOT ./Frontend/dist:/app/frontend_dist -- server/Dockerfile builds the
      # React app in its own stage and copies the result to /app/frontend_dist.
      # Mounting the host path over it shadowed the built copy with an empty
      # directory (.dockerignore excludes Frontend/dist precisely because the
      # host copy is meant to be discarded), so the backend served no UI at all
      # and local behaviour silently diverged from the deployed image.
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: mobile.Dockerfile
      args:
        # Baked into the JS bundle at build time; must be reachable from the
        # browser. Matches the backend port mapping below (5000:5000).
        BACKEND_URL: http://localhost:5000
    container_name: capstone-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  # The original React frontend. Not started by `docker compose up` (it's
  # gated behind the "react" profile) -- run `docker compose --profile react
  # up frontend-react` to bring it up alongside/instead of the Flutter one.
  frontend-react:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-frontend-react
    depends_on:
      - backend
    ports:
      - "8082:80"
    restart: unless-stopped
    profiles:
      - react
