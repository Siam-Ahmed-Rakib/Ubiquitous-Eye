services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: capstone-backend
    environment:
      SH_CLIENT_ID: ${SH_CLIENT_ID}
      SH_CLIENT_SECRET: ${SH_CLIENT_SECRET}
      # Result cache (Supabase Postgres). Empty = cache disabled, endpoints
      # behave exactly as before. Set in .env; never commit a real value.
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ./server/GRANULE:/app/GRANULE
      - ./Frontend/dist:/app/frontend_dist
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
